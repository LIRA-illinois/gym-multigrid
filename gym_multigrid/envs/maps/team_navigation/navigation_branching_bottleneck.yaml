mdp:
  initial_state: 0
  states: [0, 1, 2, 3, 4]
  goal_states: [4]
  transitions:
    - { from_state: 0, to_state: 1 }
    - { from_state: 0, to_state: 2 }
    - { from_state: 1, to_state: 3 }
    - { from_state: 2, to_state: 3 }
    - { from_state: 3, to_state: 4 }

tasks:
  - id: 0_to_1
    from_state: 0
    to_state: 1
    goal_positions: [[7, 1], [7, 5], [1, 3]]
    init_state_dist:
      states: [[[1, 1], [1, 5], [7, 3]]]
      probs: [1.0]

  - id: 0_to_2
    from_state: 0
    to_state: 2
    goal_positions: [[2, 1], [2, 5], [1, 3]]
    init_state_dist:
      states: [[[1, 1], [1, 5], [7, 3]]]
      probs: [1.0]

  - id: 1_to_3
    from_state: 1
    to_state: 3
    goal_positions: [[1, 1], [1, 5], [7, 3]]
    init_state_dist:
      states: [[[7, 1], [7, 5], [1, 3]]]
      probs: [1.0]

  - id: 2_to_3
    from_state: 2
    to_state: 3
    goal_positions: [[1, 1], [1, 5], [7, 3]]
    init_state_dist:
      states: [[[2, 1], [2, 5], [1, 3]]]
      probs: [1.0]

  - id: 3_to_4
    from_state: 3
    to_state: 4
    goal_positions: [[2, 2], [7, 4], [2, 4]]
    init_state_dist:
      states: [[[1, 1], [1, 5], [7, 3]]]
      probs: [1.0]
