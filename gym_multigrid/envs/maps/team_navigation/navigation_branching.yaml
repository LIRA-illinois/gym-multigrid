# Shared configuration for ProjectMDP and TeamNavigationEnv.
# Use with a team-nav-v0 environment and navigation_config pointing here.
mdp:
  initial_state: 0
  states: [0, 1, 2, 3, 4]
  # New post-goal state (4) has been added and is the new goal state.
  goal_states: [4]
  transitions:
    - { from_state: 0, to_state: 1 }
    - { from_state: 0, to_state: 2 }
    - { from_state: 1, to_state: 3 }
    - { from_state: 2, to_state: 3 }
    - { from_state: 3, to_state: 4 }

tasks:
  # Continuity constraint: for every edge A -> B, B's init_state_dist must
  # contain exactly one joint state, equal to A's goal_positions, with prob 1.
  - id: 0_to_1
    from_state: 0
    to_state: 1
    goal_positions: [[7, 1], [7, 5], [1, 3]]
    init_state_dist:
      states: [[[1, 1], [1, 5], [7, 3]]]
      probs: [1.0]

  - id: 0_to_2
    from_state: 0
    to_state: 2
    goal_positions: [[2, 1], [2, 5], [1, 3]]
    init_state_dist:
      states: [[[1, 1], [1, 5], [7, 3]]]
      probs: [1.0]

  - id: 1_to_3
    from_state: 1
    to_state: 3
    goal_positions: [[1, 1], [1, 5], [7, 3]]
    init_state_dist:
      states: [[[7, 1], [7, 5], [1, 3]]]
      probs: [1.0]

  - id: 2_to_3
    from_state: 2
    to_state: 3
    goal_positions: [[1, 1], [1, 5], [7, 3]]
    init_state_dist:
      states: [[[2, 1], [2, 5], [1, 3]]]
      probs: [1.0]

  - id: 3_to_4
    from_state: 3
    to_state: 4
    # The init_state_dist for 3->4 matches the predecessors' goal_positions.
    goal_positions: [[2, 2], [7, 4], [2, 4]]
    init_state_dist:
      states: [[[1, 1], [1, 5], [7, 3]]]
      probs: [1.0]