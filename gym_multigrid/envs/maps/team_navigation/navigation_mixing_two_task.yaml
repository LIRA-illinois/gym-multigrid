# Development fixture for mixed initial-state propagation.
# Three agents remain in separate halls. Each task has a two-state
# initial joint-state distribution with equal pre-specified probability.

mdp:
  initial_state: 0
  states: [0, 1, 2]
  goal_states: [2]
  transitions:
    - { from_state: 0, to_state: 1 }
    - { from_state: 1, to_state: 2 }

tasks:
  - id: 0_to_1
    from_state: 0
    to_state: 1
    goal_positions: [[4, 1], [4, 3], [4, 5]]
    init_state_dist:
      states:
        - [[1, 1], [1, 3], [1, 5]]
        - [[2, 1], [2, 3], [2, 5]]
      probs: [0.5, 0.5]

  - id: 1_to_2
    from_state: 1
    to_state: 2
    goal_positions: [[6, 1], [6, 3], [6, 5]]
    init_state_dist:
      states:
        - [[4, 1], [4, 3], [4, 5]]
        - [[5, 1], [5, 3], [5, 5]]
      probs: [0.5, 0.5]
