# Controlled branching navigation configuration for 3ga_1r_small_hall.
# Use this file as navigation_config with map_name=3ga_1r_small_hall.
# Each agent stays in its own horizontal hall. Every successor goal is at
# least three spaces from its predecessor goal.
mdp:
  initial_state: 0
  states: [0, 1, 2, 3, 4]
  goal_states: [4]
  transitions:
    - { from_state: 0, to_state: 1 }
    - { from_state: 0, to_state: 2 }
    - { from_state: 1, to_state: 3 }
    - { from_state: 2, to_state: 3 }
    - { from_state: 3, to_state: 4 }

tasks:
  - id: 0_to_1
    from_state: 0
    to_state: 1
    goal_positions: [[4, 1], [4, 3], [4, 5]]
    init_state_dist:
      states: [[[1, 1], [1, 3], [1, 5]]]
      probs: [1.0]

  - id: 0_to_2
    from_state: 0
    to_state: 2
    goal_positions: [[5, 1], [5, 3], [5, 5]]
    init_state_dist:
      states: [[[1, 1], [1, 3], [1, 5]]]
      probs: [1.0]

  - id: 1_to_3
    from_state: 1
    to_state: 3
    goal_positions: [[1, 1], [1, 3], [1, 5]]
    init_state_dist:
      states: [[[4, 1], [4, 3], [4, 5]]]
      probs: [1.0]

  - id: 2_to_3
    from_state: 2
    to_state: 3
    goal_positions: [[1, 1], [1, 3], [1, 5]]
    init_state_dist:
      states: [[[5, 1], [5, 3], [5, 5]]]
      probs: [1.0]

  - id: 3_to_4
    from_state: 3
    to_state: 4
    goal_positions: [[6, 1], [6, 3], [6, 5]]
    init_state_dist:
      states: [[[1, 1], [1, 3], [1, 5]]]
      probs: [1.0]
